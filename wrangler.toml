# Cloudflare Workers + Static Assets configuration
# This deploys the prebuilt static site in dist/ as a Workers project
# with static asset binding, so the wrong "wrangler deploy" command works.

name = "openapihub"
compatibility_date = "2025-09-23"
main = "src/worker.js"

[assets]
directory = "./dist"
not_found_handling = "404-page"